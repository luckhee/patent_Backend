services:
  mysql:
    image: mysql:8.0
    container_name: team10-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: team10_dev
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "devuser", "-pdevpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: team10-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mongo:
    image: mongo:7
    container_name: team10-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: dhalwk12!
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  minio:
    image: quay.io/minio/minio
    container_name: team10-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: dhalwk12!
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console (http://localhost:9001)
    volumes:
      - minio-data:/data

  # dev-bucket 자동 생성 후 종료되는 일회성 컨테이너
  minio-init:
    image: quay.io/minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 admin 'dhalwk12!'; do sleep 2; done;
      mc mb -p local/dev-bucket;
      exit 0;
      "

volumes:
  mysql-data:
  redis-data:
  mongo-data:
  minio-data:
